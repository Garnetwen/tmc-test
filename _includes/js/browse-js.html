<script>
    /* =========================================================
       Existing object files generated by Jekyll
       This prevents requesting missing cover files.
       ========================================================= */

    const EXISTING_OBJECT_FILES = new Set([
      {% assign object_files = site.static_files | where_exp: "file", "file.path contains '/objects/'" %}
      {% for file in object_files %}
        "{{ file.name | escape }}"{% unless forloop.last %},{% endunless %}
      {% endfor %}
    ]);

    /* =========================================================
       Helpers
       ========================================================= */

    function hasValue(value) {
      return value !== undefined && value !== null && String(value).trim() !== "";
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function getObjectTitle(item) {
      if (!item) return "Untitled";

      return (
        item.title ||
        item.title_eng ||
        item.title_page_title ||
        item.title_tib ||
        item.filename ||
        "Untitled"
      );
    }

    function getFormatFromFilename(item) {
      if (!item || !hasValue(item.filename)) {
        return "record";
      }

      const filename = String(item.filename).toLowerCase().trim();

      if (filename.endsWith(".pdf")) {
        return "pdf";
      }

      if (/\.(jpg|jpeg|png|gif|webp|tif|tiff|bmp|svg)$/.test(filename)) {
        return "image";
      }

      if (/\.(mp3|wav|m4a|flac|ogg)$/.test(filename)) {
        return "audio";
      }

      if (/\.(mp4|mov|webm|m4v|avi)$/.test(filename)) {
        return "video";
      }

      return "record";
    }

    function resolveProjectPath(value, defaultDirectory) {
      if (!hasValue(value)) {
        return "";
      }

      const raw = String(value).trim();

      if (/^https?:\/\//i.test(raw)) {
        return raw;
      }

      if (raw.includes("/")) {
        return "{{ '' | relative_url }}" + (raw.startsWith("/") ? raw : "/" + raw);
      }

      return (
        "{{ '' | relative_url }}/" +
        defaultDirectory.replace(/^\/|\/$/g, "") +
        "/" +
        raw
      );
    }

    function getFilenameOnly(value) {
      if (!hasValue(value)) return "";

      return String(value)
        .trim()
        .split("/")
        .pop();
    }

    function findFileLink(item) {
      return resolveProjectPath(item && item.filename, "objects");
    }

    function findCoverLink(item) {
      if (!item || !hasValue(item.cover)) {
        return "";
      }

      const rawCover = String(item.cover).trim();

      // If it is an external URL, allow it.
      // Note: external URLs cannot be checked by Jekyll in advance.
      if (/^https?:\/\//i.test(rawCover)) {
        return rawCover;
      }

      const coverFilename = getFilenameOnly(rawCover);

      // Important:
      // Only return a cover URL if the file actually exists in /objects.
      // If it does not exist, return blank so the browser never requests it.
      if (!EXISTING_OBJECT_FILES.has(coverFilename)) {
        return "";
      }

      return resolveProjectPath(rawCover, "objects");
    }

    function getBrowseSubtitle(item) {
      const parts = [];

      if (hasValue(item.author)) {
        parts.push(item.author);
      }

      if (hasValue(item.pub_year)) {
        parts.push(item.pub_year);
      }

      if (hasValue(item.series_eng)) {
        parts.push(item.series_eng);
      } else if (hasValue(item.series)) {
        parts.push(item.series);
      }

      if (hasValue(item.seriesnumber)) {
        parts.push("Vol. " + item.seriesnumber);
      }

      return parts.join(" · ");
    }

    /* =========================================================
       Thumbnail
       ========================================================= */

   function getThumbHTML(item) {
    const title = getObjectTitle(item);
    const coverLink = findCoverLink(item);

    /*
      Behavior:
      - cover exists and loads: show image
      - cover missing / fails: leave blank box
      - no cover value: blank box
    */

    if (coverLink) {
      return `
        <div class="bg-light overflow-hidden border-bottom" style="aspect-ratio: 3 / 4;">
          <img
            class="card-img-top w-100 h-100"
            src="${coverLink}"
            loading="lazy"
            alt="Cover of ${escapeHtml(title)}"
            style="object-fit: contain;"
            onerror="
              this.onerror = null;
              this.remove();
            "
          >
        </div>
      `;
    }

    return `
      <div class="bg-light overflow-hidden border-bottom" style="aspect-ratio: 3 / 4;"></div>
    `;
  }

    /* =========================================================
       Card
       ========================================================= */

    function recordToCard(item) {
      const title = getObjectTitle(item);
      const subtitle = getBrowseSubtitle(item);
      const format = getFormatFromFilename(item);

      const itemUrl =
        "{{ '/item.html' | relative_url }}?id=" +
        encodeURIComponent(item.objectid);

      const formatBadge =
        format === "record"
          ? ""
          : `<span class="badge bg-light text-dark border">${format.toUpperCase()}</span>`;

      return `
        <div class="col-12 col-sm-6 col-md-4 col-lg-3 mb-4">
          <div class="card h-100">

            ${getThumbHTML(item)}

            <div class="card-body">
              <h3 class="h6 card-title mb-2">
                <a
                  class="stretched-link text-decoration-none"
                  href="${itemUrl}"
                >
                  ${escapeHtml(title)}
                </a>
              </h3>

              ${
                subtitle
                  ? `<div class="small text-muted">${escapeHtml(subtitle)}</div>`
                  : ""
              }
            </div>

            <div class="card-footer d-flex justify-content-between align-items-center">
              <small class="text-muted">
                ${escapeHtml(item.objectid || "")}
              </small>

              ${formatBadge}
            </div>
          </div>
        </div>
      `;
    }

    /* =========================================================
       Search
       ========================================================= */

    function normalize(value) {
      return String(value ?? "")
        .toLowerCase()
        .trim();
    }

    function itemMatchesQuery(item, query) {
      if (!query) {
        return true;
      }

      const normalizedQuery = normalize(query);

      const searchableValues = [
        item.objectid,
        item.seriesnumber,
        item.filename,
        item.cover,

        item.title,
        item.title_tib,
        item.title_eng,
        item.title_page_title,
        item.title_page_title_tib,
        item.title_chi_pinyin,
        item.title_chi_characters,

        item.author,
        item.author_tib,
        item.author_phonetics,

        item.pub_year,
        item.ISBN,
        item.bdrc_description,

        item.subjects,
        item.subject_year,

        item.location,
        item.location_tib,

        item.series,
        item.series_tib,
        item.series_eng,
        item.series_chi_pinyin,
        item.series_chi_characters,

        item.publisher,
        item.publisher_tib,
        item.publisher_chi_pinyin,
      ];

      const haystack = searchableValues
        .filter(hasValue)
        .map(normalize)
        .join(" ");

      return haystack.includes(normalizedQuery);
    }

    /* =========================================================
       Sorting
       ========================================================= */

    function shuffleItems(items) {
      const shuffled = items.slice();

      for (let i = shuffled.length - 1; i > 0; i--) {
        const randomIndex = Math.floor(Math.random() * (i + 1));

        [shuffled[i], shuffled[randomIndex]] = [
          shuffled[randomIndex],
          shuffled[i],
        ];
      }

      return shuffled;
    }

    function compareValues(a, b) {
      const aValue = hasValue(a) ? String(a).trim() : "";
      const bValue = hasValue(b) ? String(b).trim() : "";

      const aNumber = Number(aValue);
      const bNumber = Number(bValue);

      const bothNumeric =
        aValue !== "" &&
        bValue !== "" &&
        !Number.isNaN(aNumber) &&
        !Number.isNaN(bNumber);

      if (bothNumeric) {
        return aNumber - bNumber;
      }

      return aValue.localeCompare(bValue, undefined, {
        numeric: true,
        sensitivity: "base",
      });
    }

    function sortItems(items, key) {
      if (key === "random") {
        return shuffleItems(items);
      }

      if (key === "title") {
        return items
          .slice()
          .sort((a, b) =>
            getObjectTitle(a).localeCompare(getObjectTitle(b), undefined, {
              numeric: true,
              sensitivity: "base",
            })
          );
      }

      return items
        .slice()
        .sort((a, b) => compareValues(a[key], b[key]));
    }

    /* =========================================================
       Render
       ========================================================= */

    function renderBrowse(items) {
      const browseItems = document.getElementById("browseItems");
      const numberOf = document.getElementById("numberOf");

      if (!browseItems) {
        return;
      }

      if (items.length === 0) {
        browseItems.innerHTML = `
          <div class="col-12">
            <div class="alert alert-secondary text-center">
              No items found.
            </div>
          </div>
        `;
      } else {
        browseItems.innerHTML = items.map(recordToCard).join("");
      }

      if (numberOf) {
        numberOf.textContent =
          items.length === 1
            ? "1 item"
            : items.length + " items";
      }
    }

    /* =========================================================
       Page state and controls
       ========================================================= */

    (function () {
      const loadingIcon = document.getElementById("loadingIcon");
      const filterInput = document.getElementById("filterTextBox");
      const sortLabel = document.getElementById("sortFilter");

      let allItems = [];
      let visibleItems = [];

      function getActiveSortKey() {
        const activeButton = document.querySelector(
          ".browse-sort-item.active"
        );

        return activeButton
          ? activeButton.getAttribute("data-filter")
          : "random";
      }

      function updateBrowse() {
        const query = filterInput
          ? filterInput.value.trim()
          : "";

        const sortKey = getActiveSortKey();

        visibleItems = allItems.filter((item) =>
          itemMatchesQuery(item, query)
        );

        visibleItems = sortItems(visibleItems, sortKey);

        renderBrowse(visibleItems);
      }

      window.submitFilter = function () {
        updateBrowse();
      };

      window.resetFilter = function () {
        if (filterInput) {
          filterInput.value = "";
        }

        document
          .querySelectorAll(".browse-sort-item")
          .forEach((button) => button.classList.remove("active"));

        const randomButton = document.querySelector(
          '.browse-sort-item[data-filter="random"]'
        );

        if (randomButton) {
          randomButton.classList.add("active");
        }

        if (sortLabel) {
          sortLabel.textContent = "Random";
        }

        updateBrowse();
      };

      document.addEventListener("click", function (event) {
        const sortButton = event.target.closest(
          ".browse-sort-item"
        );

        if (!sortButton) {
          return;
        }

        document
          .querySelectorAll(".browse-sort-item")
          .forEach((button) => button.classList.remove("active"));

        sortButton.classList.add("active");

        const sortKey =
          sortButton.getAttribute("data-filter") || "random";

        if (sortLabel) {
          sortLabel.textContent =
            sortKey === "random"
              ? "Random"
              : sortKey === "title"
              ? "Title"
              : sortButton.textContent.trim();
        }

        updateBrowse();
      });

      const browseInit = function (cb_items) {
        try {
          allItems = Array.isArray(cb_items)
            ? cb_items.filter(
                (item) =>
                  item &&
                  hasValue(item.objectid) &&
                  !hasValue(item.parentid)
              )
            : [];

          visibleItems = shuffleItems(allItems);

          renderBrowse(visibleItems);
        } catch (error) {
          console.error("Browse initialization failed:", error);

          const browseItems =
            document.getElementById("browseItems");

          if (browseItems) {
            browseItems.innerHTML = `
              <div class="col-12">
                <div class="alert alert-danger">
                  The browse page could not load the collection data.
                  Check the browser console for details.
                </div>
              </div>
            `;
          }
        } finally {
          if (loadingIcon) {
            loadingIcon.style.display = "none";
          }
        }
      };

      if (window.includeFunctions) {
        includeFunctions.push(browseInit);
      } else {
        window.addEventListener(
          "DOMContentLoaded",
          function () {
            if (window.cb_items) {
              browseInit(window.cb_items);
            }
          }
        );
      }
    })();
</script>
